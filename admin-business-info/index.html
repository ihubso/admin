<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Info · Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #0F172A;
        }
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 260px;
            background: #0F172A;
            color: white;
            padding: 24px 16px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        .sidebar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
        }
        .sidebar .brand .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6C3CE1, #5A2FC4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
        }
        .sidebar .brand .name { font-weight: 700; font-size: 16px; }
        .sidebar .brand .name span { color: #8B6BE8; }
        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
            cursor: pointer;
        }
        .sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .sidebar .nav-item.active { background: rgba(108,60,225,0.2); color: #8B6BE8; }
        .sidebar .nav-item i { width: 20px; font-size: 16px; }
        .sidebar .nav-section {
            padding: 12px 14px 8px;
            font-size: 11px;
            font-weight: 700;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .sidebar .logout-btn {
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 16px;
        }
        .sidebar .logout-btn .nav-item { color: rgba(255,255,255,0.4); }
        .sidebar .logout-btn .nav-item:hover { color: #EF4444; background: rgba(239,68,68,0.1); }
        .main-content {
            margin-left: 260px;
            padding: 24px 32px;
            width: 100%;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid #E2E8F0;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .topbar h1 { font-size: 24px; font-weight: 800; }
        .topbar .admin-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar .admin-info .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #6C3CE1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
        }
        .form-container {
            background: white;
            border-radius: 16px;
            padding: 32px;
            border: 1px solid #f0f0f0;
            max-width: 800px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #1E293B;
            margin-bottom: 4px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #6C3CE1;
            box-shadow: 0 0 0 4px rgba(108,60,225,0.1);
        }
        .form-group .help-text {
            font-size: 12px;
            color: #94A3B8;
            margin-top: 4px;
        }
        .btn-submit {
            padding: 12px 32px;
            background: linear-gradient(135deg, #6C3CE1, #5A2FC4);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(108,60,225,0.3);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108,60,225,0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            z-index: 9999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            max-width: 90%;
            text-align: center;
            animation: toastUp 0.3s ease;
            font-family: 'Inter', sans-serif;
            color: white;
        }
        .toast-msg.success { background: #10B981; }
        .toast-msg.error { background: #EF4444; }
        @keyframes toastUp {
            from { transform: translateX(-50%) translateY(20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        .toast-msg.hide {
            opacity: 0;
            transform: translateX(-50%) translateY(-20px);
            transition: all 0.3s ease;
        }
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            color: #0F172A;
            cursor: pointer;
            padding: 8px;
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 99;
        }
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 280px;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.active { display: block; }
            .main-content { margin-left: 0; padding: 16px; }
            .mobile-toggle { display: block; }
            .topbar h1 { font-size: 20px; }
            .form-container { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="logo">ST</div>
                <div class="name">Sucess<span>Tech</span></div>
            </div>

            <div class="nav-section">Main</div>
            <a href="/admin-dashboard/" class="nav-item">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>
            <a href="/admin-analytics/" class="nav-item">
                <i class="fas fa-chart-line"></i> Analytics
            </a>
            <a href="/admin-orders/" class="nav-item">
                <i class="fas fa-shopping-bag"></i> Orders
            </a>
            <a href="/admin-customers/" class="nav-item">
                <i class="fas fa-users"></i> Customers
            </a>
            <a href="/admin-reviews/" class="nav-item">
                <i class="fas fa-star"></i> Reviews
            </a>

            <div class="nav-section">Products</div>
            <a href="/admin-add-product/" class="nav-item">
                <i class="fas fa-plus-circle"></i> Add Product
            </a>
            <a href="/admin-products/" class="nav-item">
                <i class="fas fa-boxes"></i> Product List
            </a>

            <div class="nav-section">Settings</div>
            <a href="/admin-business-info/" class="nav-item active">
                <i class="fas fa-store"></i> Business Info
            </a>
            <a href="/admin-featured/" class="nav-item">
                <i class="fas fa-star"></i> Featured Product
            </a>
            <a href="/admin-contact/" class="nav-item">
                <i class="fas fa-map-marker-alt"></i> Contact & Location
            </a>
                        <a href="/admin-category-showcase/" class="nav-item">
                <i class="fas fa-layer-group"></i> Category Showcase
            </a>

            <div class="logout-btn">
                <div class="nav-item" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="topbar">
                <div style="display:flex;align-items:center;gap:12px;">
                    <button class="mobile-toggle" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1>🏢 Business Info</h1>
                </div>
                <div class="admin-info">
                    <span style="font-size:14px;color:#475569;" id="adminName">Admin</span>
                    <div class="avatar" id="adminAvatar">A</div>
                </div>
            </div>

            <!-- Form -->
            <div class="form-container">
                <form id="businessInfoForm">
                    <div class="form-group">
                        <label>Shop Name <span class="required">*</span></label>
                        <input type="text" id="shopName" placeholder="Your shop name" required />
                    </div>

                    <div class="form-group">
                        <label>Email Address <span class="required">*</span></label>
                        <input type="email" id="shopEmail" placeholder="shop@example.com" required />
                    </div>

                    <div class="form-group">
                        <label>Phone Number <span class="required">*</span></label>
                        <input type="tel" id="shopPhone" placeholder="+237 6XX XXX XXX" required />
                    </div>

                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="shopAddress" placeholder="123 Main St, City, Country" />
                    </div>

                    <div class="form-group">
                        <label>Facebook URL</label>
                        <input type="url" id="shopFacebook" placeholder="https://facebook.com/yourpage" />
                        <div class="help-text">Leave empty to hide</div>
                    </div>

                    <div class="form-group">
                        <label>Instagram URL</label>
                        <input type="url" id="shopInstagram" placeholder="https://instagram.com/yourpage" />
                        <div class="help-text">Leave empty to hide</div>
                    </div>

                    <div class="form-group">
                        <label>TikTok URL</label>
                        <input type="url" id="shopTiktok" placeholder="https://tiktok.com/@yourpage" />
                        <div class="help-text">Leave empty to hide</div>
                    </div>

                    <div style="display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;">
                        <button type="submit" class="btn-submit" id="submitBtn">
                            <i class="fas fa-save"></i> Save Business Info
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        //  ADMIN BUSINESS INFO
        // ============================================================

        const SUPABASE_URL = 'https://bulprhgwuwatzobiojwz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1bHByaGd3dXdhdHpvYmlvand6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MDczNDksImV4cCI6MjA5MjA4MzM0OX0.2fcHrGX7iXw5G9nGRNkBy70W1Ex_om1C0v3qbryPmvw';

        let supabaseClient = null;

        function getSupabase() {
            if (supabaseClient) return supabaseClient;
            if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return supabaseClient;
            }
            return null;
        }

        function checkAuth() {
            const session = JSON.parse(localStorage.getItem('admin_session') || 'null');
            if (!session || !session.loggedIn) {
                window.location.href = 'index.html';
                return false;
            }
            const name = session.user?.email?.split('@')[0] || 'Admin';
            document.getElementById('adminName').textContent = name.charAt(0).toUpperCase() + name.slice(1);
            document.getElementById('adminAvatar').textContent = name.charAt(0).toUpperCase();
            return true;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function logout() {
            localStorage.removeItem('admin_session');
            window.location.href = 'index.html';
        }

        function showToast(msg, type = 'success') {
            const existing = document.querySelector('.toast-msg');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast-msg ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Load Business Info ---
        async function loadBusinessInfo() {
            const client = getSupabase();
            if (!client) return;

            try {
                const { data, error } = await client
                    .from('business_info')
                    .select('*')
                    .eq('id', 1)
                    .single();

                if (error) throw error;

                if (data) {
                    document.getElementById('shopName').value = data.shop_name || '';
                    document.getElementById('shopEmail').value = data.email || '';
                    document.getElementById('shopPhone').value = data.phone || '';
                    document.getElementById('shopAddress').value = data.address || '';
                    document.getElementById('shopFacebook').value = data.facebook || '';
                    document.getElementById('shopInstagram').value = data.instagram || '';
                    document.getElementById('shopTiktok').value = data.tiktok || '';
                }

            } catch (err) {
                console.error('Error loading business info:', err);
                showToast('Failed to load business info', 'error');
            }
        }

        // --- Save Business Info ---
        document.getElementById('businessInfoForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const client = getSupabase();
            if (!client) {
                showToast('❌ Database connection failed', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            try {
                const data = {
                    shop_name: document.getElementById('shopName').value.trim(),
                    email: document.getElementById('shopEmail').value.trim(),
                    phone: document.getElementById('shopPhone').value.trim(),
                    address: document.getElementById('shopAddress').value.trim() || '',
                    facebook: document.getElementById('shopFacebook').value.trim() || '',
                    instagram: document.getElementById('shopInstagram').value.trim() || '',
                    tiktok: document.getElementById('shopTiktok').value.trim() || ''
                };

                const { error } = await client
                    .from('business_info')
                    .upsert({ id: 1, ...data });

                if (error) throw error;

                showToast('✅ Business info saved successfully!');
                btn.innerHTML = '<i class="fas fa-save"></i> Save Business Info';
                btn.disabled = false;

            } catch (err) {
                console.error('Error saving business info:', err);
                showToast('❌ Failed to save: ' + err.message, 'error');
                btn.innerHTML = '<i class="fas fa-save"></i> Save Business Info';
                btn.disabled = false;
            }
        });

        // --- Init ---
        document.addEventListener('DOMContentLoaded', function() {
            if (checkAuth()) {
                loadBusinessInfo();
                document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const sidebar = document.getElementById('sidebar');
                if (sidebar.classList.contains('open')) toggleSidebar();
            }
        });
    </script><script src="push-client.js"></script>
</body>
</html>
