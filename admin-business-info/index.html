<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Info · Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0F172A; }
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #0F172A; color: white; padding: 24px 16px; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 100; transition: transform 0.3s ease; }
        .sidebar .brand { display: flex; align-items: center; gap: 12px; padding: 0 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 20px; }
        .sidebar .brand .logo { width: 40px; height: 40px; background: linear-gradient(135deg, #6C3CE1, #5A2FC4); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
        .sidebar .brand .name { font-weight: 700; font-size: 16px; }
        .sidebar .brand .name span { color: #8B6BE8; }
        .sidebar .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; color: rgba(255,255,255,0.6); text-decoration: none; transition: all 0.2s ease; font-size: 14px; font-weight: 500; margin-bottom: 2px; cursor: pointer; }
        .sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .sidebar .nav-item.active { background: rgba(108,60,225,0.2); color: #8B6BE8; }
        .sidebar .nav-item i { width: 20px; font-size: 16px; }
        .sidebar .nav-section { padding: 12px 14px 8px; font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 0.5px; }
        .sidebar .logout-btn { margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 16px; }
        .sidebar .logout-btn .nav-item { color: rgba(255,255,255,0.4); }
        .sidebar .logout-btn .nav-item:hover { color: #EF4444; background: rgba(239,68,68,0.1); }
        .main-content { margin-left: 260px; padding: 24px 32px; width: 100%; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid #E2E8F0; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .topbar h1 { font-size: 24px; font-weight: 800; }
        .topbar .admin-info { display: flex; align-items: center; gap: 12px; }
        .topbar .admin-info .avatar { width: 40px; height: 40px; border-radius: 50%; background: #6C3CE1; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px; }
        .form-container { background: white; border-radius: 16px; padding: 32px; border: 1px solid #f0f0f0; max-width: 800px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; color: #1E293B; margin-bottom: 4px; }
        .form-group label .required { color: #EF4444; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; border: 2px solid #E2E8F0; border-radius: 8px; font-size: 14px; font-weight: 500; outline: none; transition: all 0.2s ease; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus { border-color: #6C3CE1; box-shadow: 0 0 0 4px rgba(108,60,225,0.1); }
        .form-group input.error { border-color: #EF4444; box-shadow: 0 0 0 4px rgba(239,68,68,0.1); }
        .form-group .help-text { font-size: 12px; color: #94A3B8; margin-top: 4px; }
        .btn-submit { padding: 12px 32px; background: linear-gradient(135deg, #6C3CE1, #5A2FC4); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; transition: all 0.3s ease; font-family: inherit; box-shadow: 0 4px 12px rgba(108,60,225,0.3); }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(108,60,225,0.4); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .toast-msg { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 14px 24px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 9999; box-shadow: 0 8px 32px rgba(0,0,0,0.2); max-width: 90%; text-align: center; animation: toastUp 0.3s ease; font-family: 'Inter', sans-serif; color: white; }
        .toast-msg.success { background: #10B981; }
        .toast-msg.error { background: #EF4444; }
        @keyframes toastUp { from { transform: translateX(-50%) translateY(20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
        .toast-msg.hide { opacity: 0; transform: translateX(-50%) translateY(-20px); transition: all 0.3s ease; }
        .mobile-toggle { display: none; background: none; border: none; font-size: 24px; color: #0F172A; cursor: pointer; padding: 8px; }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
        .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #E2E8F0; border-top-color: #6C3CE1; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.active { display: block; }
            .main-content { margin-left: 0; padding: 16px; }
            .mobile-toggle { display: block; }
            .topbar h1 { font-size: 20px; }
            .form-container { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="admin-layout">
    <aside class="sidebar" id="sidebar">
        <div class="brand"><div class="logo">ST</div><div class="name">Sucess<span>Tech</span></div></div>
        <div class="nav-section">Main</div>
        <a href="/admin-dashboard/" class="nav-item"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a href="/admin-analytics/" class="nav-item"><i class="fas fa-chart-line"></i> Analytics</a>
        <a href="/admin-orders/" class="nav-item"><i class="fas fa-shopping-bag"></i> Orders</a>
        <a href="/admin-customers/" class="nav-item"><i class="fas fa-users"></i> Customers</a>
        <a href="/admin-reviews/" class="nav-item"><i class="fas fa-star"></i> Reviews</a>
        <div class="nav-section">Products</div>
        <a href="/admin-add-product/" class="nav-item"><i class="fas fa-plus-circle"></i> Add Product</a>
        <a href="/admin-products/" class="nav-item"><i class="fas fa-boxes"></i> Product List</a>
        <div class="nav-section">Settings</div>
        <a href="/admin-business-info/" class="nav-item active"><i class="fas fa-store"></i> Business Info</a>
        <a href="/admin-featured/" class="nav-item"><i class="fas fa-star"></i> Featured Product</a>
        <a href="/admin-contact/" class="nav-item"><i class="fas fa-map-marker-alt"></i> Contact & Location</a>
        <a href="/admin-category-showcase/" class="nav-item"><i class="fas fa-layer-group"></i> Category Showcase</a>
        <div class="logout-btn"><div class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</div></div>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1>🏢 Business Info</h1>
            </div>
            <div class="admin-info">
                <span style="font-size:14px;color:#475569;" id="adminName">Admin</span>
                <div class="avatar" id="adminAvatar">A</div>
            </div>
        </div>

        <div class="form-container">
            <div id="loadingState" style="text-align:center;padding:20px;color:#94A3B8;">
                <div class="loading-spinner"></div>
                <span style="vertical-align:middle;">Loading business info...</span>
            </div>

            <form id="businessInfoForm" style="display:none;">
                <div class="form-group">
                    <label>Shop Name <span class="required">*</span></label>
                    <input type="text" id="shopName" placeholder="Your shop name" required />
                </div>

                <div class="form-group">
                    <label>Email Address <span class="required">*</span></label>
                    <input type="email" id="shopEmail" placeholder="shop@example.com" required />
                </div>

                <div class="form-group">
                    <label>Phone Number <span class="required">*</span></label>
                    <input type="tel" id="shopPhone" placeholder="+237 6XX XXX XXX" required />
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="shopAddress" placeholder="123 Main St, City, Country" />
                </div>

                <div class="form-group">
                    <label>Facebook URL</label>
                    <input type="url" id="shopFacebook" placeholder="https://facebook.com/yourpage" />
                    <div class="help-text">Leave empty to hide</div>
                </div>

                <div class="form-group">
                    <label>Instagram URL</label>
                    <input type="url" id="shopInstagram" placeholder="https://instagram.com/yourpage" />
                    <div class="help-text">Leave empty to hide</div>
                </div>

                <div class="form-group">
                    <label>TikTok URL</label>
                    <input type="url" id="shopTiktok" placeholder="https://tiktok.com/@yourpage" />
                    <div class="help-text">Leave empty to hide</div>
                </div>

                <div style="display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;">
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <i class="fas fa-save"></i> Save Business Info
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

<script>
// ============================================================
//  ADMIN BUSINESS INFO — Supabase Auth + RPC
// ============================================================
const SUPABASE_URL = 'https://bulprhgwuwatzobiojwz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1bHByaGd3dXdhdHpvYmlvand6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MDczNDksImV4cCI6MjA5MjA4MzM0OX0.2fcHrGX7iXw5G9nGRNkBy70W1Ex_om1C0v3qbryPmvw';
const LOGIN_URL = '/login/';

const getsb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- Sidebar ----------
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('active');
}
window.toggleSidebar = toggleSidebar;

document.getElementById('sidebarOverlay')?.addEventListener('click', toggleSidebar);
document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
        const sidebar = document.getElementById('sidebar');
        if (sidebar.classList.contains('open')) toggleSidebar();
    }
});

// ---------- Auth ----------
async function checkAuth() {
    try {
        const { data: { session } } = await getsb.auth.getSession();
        if (!session) { window.location.href = LOGIN_URL; return null; }

        const { data: me, error } = await getsb.rpc('admin_me');
        if (error || !me || me.length === 0) {
            await getsb.auth.signOut();
            window.location.href = LOGIN_URL;
            return null;
        }
        const admin = me[0];
        const displayName = admin.full_name || admin.email || 'Admin';
        document.getElementById('adminName').textContent = displayName;
        document.getElementById('adminAvatar').textContent = displayName.charAt(0).toUpperCase();
        return admin;
    } catch (err) {
        console.error('checkAuth error:', err);
        window.location.href = LOGIN_URL;
        return null;
    }
}

async function logout() {
    try { await getsb.auth.signOut(); } catch (_) {}
    window.location.href = LOGIN_URL;
}
window.logout = logout;

// ---------- Helpers ----------
function showToast(msg, type = 'success') {
    const existing = document.querySelector('.toast-msg');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = `toast-msg ${type}`;
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.classList.add('hide');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// ---------- Load Business Info (RPC) ----------
async function loadBusinessInfo() {
    try {
        // ✅ SECURE: SECURITY DEFINER RPC — no RLS guesswork, no column-type guesswork
        const { data, error } = await getsb.rpc('admin_get_business_info');
        if (error) throw error;

        // Empty object means "no row yet" — form starts blank, first save will insert
        if (data && typeof data === 'object') {
            document.getElementById('shopName').value      = data.shop_name || '';
            document.getElementById('shopEmail').value     = data.email     || '';
            document.getElementById('shopPhone').value     = data.phone     || '';
            document.getElementById('shopAddress').value   = data.address   || '';
            document.getElementById('shopFacebook').value  = data.facebook  || '';
            document.getElementById('shopInstagram').value = data.instagram || '';
            document.getElementById('shopTiktok').value    = data.tiktok    || '';
        }

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('businessInfoForm').style.display = 'block';

    } catch (err) {
        console.error('Error loading business info:', err);
        document.getElementById('loadingState').innerHTML = `
            <i class="fas fa-exclamation-circle" style="font-size:24px;color:#EF4444;display:block;margin-bottom:8px;"></i>
            Failed to load business info
        `;
    }
}

// ---------- Save Business Info (RPC) ----------
document.getElementById('businessInfoForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const shopName = document.getElementById('shopName').value.trim();
    const shopEmail = document.getElementById('shopEmail').value.trim();
    const shopPhone = document.getElementById('shopPhone').value.trim();

    // Simple required validation (HTML required + these to be safe)
    document.getElementById('shopName').classList.toggle('error', !shopName);
    document.getElementById('shopEmail').classList.toggle('error', !shopEmail);
    document.getElementById('shopPhone').classList.toggle('error', !shopPhone);
    if (!shopName || !shopEmail || !shopPhone) {
        showToast('Please fill all required fields', 'error');
        return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

    try {
        const payload = {
            shop_name: shopName,
            email:     shopEmail,
            phone:     shopPhone,
            address:   document.getElementById('shopAddress').value.trim()   || '',
            facebook:  document.getElementById('shopFacebook').value.trim()  || '',
            instagram: document.getElementById('shopInstagram').value.trim() || '',
            tiktok:    document.getElementById('shopTiktok').value.trim()    || ''
        };

        // ✅ SECURE: SECURITY DEFINER RPC — bypasses business_info RLS
        const { error } = await getsb.rpc('admin_save_business_info', {
            p_payload: payload
        });
        if (error) throw error;

        showToast('✅ Business info saved successfully!');

    } catch (err) {
        console.error('Error saving business info:', err);
        showToast('❌ ' + (err.message || 'Failed to save'), 'error');
    } finally {
        btn.innerHTML = '<i class="fas fa-save"></i> Save Business Info';
        btn.disabled = false;
    }
});

// ---------- Boot ----------
document.addEventListener('DOMContentLoaded', async function () {
    const admin = await checkAuth();
    if (!admin) return;

    loadBusinessInfo();
});
</script>
<script src="/push-client.js"></script>
</body>
</html>
