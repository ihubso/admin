<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Featured Product · Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #0F172A;
        }
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 260px;
            background: #0F172A;
            color: white;
            padding: 24px 16px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        .sidebar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
        }
        .sidebar .brand .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6C3CE1, #5A2FC4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
        }
        .sidebar .brand .name { font-weight: 700; font-size: 16px; }
        .sidebar .brand .name span { color: #8B6BE8; }
        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
            cursor: pointer;
        }
        .sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .sidebar .nav-item.active { background: rgba(108,60,225,0.2); color: #8B6BE8; }
        .sidebar .nav-item i { width: 20px; font-size: 16px; }
        .sidebar .nav-section {
            padding: 12px 14px 8px;
            font-size: 11px;
            font-weight: 700;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .sidebar .logout-btn {
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 16px;
        }
        .sidebar .logout-btn .nav-item { color: rgba(255,255,255,0.4); }
        .sidebar .logout-btn .nav-item:hover { color: #EF4444; background: rgba(239,68,68,0.1); }
        .main-content {
            margin-left: 260px;
            padding: 24px 32px;
            width: 100%;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid #E2E8F0;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .topbar h1 { font-size: 24px; font-weight: 800; }
        .topbar .admin-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar .admin-info .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #6C3CE1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
        }
        .form-container {
            background: white;
            border-radius: 16px;
            padding: 32px;
            border: 1px solid #f0f0f0;
            max-width: 800px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #1E293B;
            margin-bottom: 4px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #6C3CE1;
            box-shadow: 0 0 0 4px rgba(108,60,225,0.1);
        }
        .featured-list {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 2px solid #E2E8F0;
        }
        .featured-list .featured-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #f0f0f0;
        }
        .featured-list .featured-item .product-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .featured-list .featured-item .product-info img {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
        }
        .featured-list .featured-item .remove-btn {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            background: #FEE2E2;
            color: #DC2626;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .featured-list .featured-item .remove-btn:hover { background: #DC2626; color: white; }
        .btn-submit {
            padding: 12px 32px;
            background: linear-gradient(135deg, #6C3CE1, #5A2FC4);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(108,60,225,0.3);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108,60,225,0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            z-index: 9999;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            max-width: 90%;
            text-align: center;
            animation: toastUp 0.3s ease;
            font-family: 'Inter', sans-serif;
            color: white;
        }
        .toast-msg.success { background: #10B981; }
        .toast-msg.error { background: #EF4444; }
        @keyframes toastUp {
            from { transform: translateX(-50%) translateY(20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        .toast-msg.hide {
            opacity: 0;
            transform: translateX(-50%) translateY(-20px);
            transition: all 0.3s ease;
        }
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            color: #0F172A;
            cursor: pointer;
            padding: 8px;
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 99;
        }
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 280px;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.active { display: block; }
            .main-content { margin-left: 0; padding: 16px; }
            .mobile-toggle { display: block; }
            .topbar h1 { font-size: 20px; }
            .form-container { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="logo">ST</div>
                <div class="name">Sucess<span>Tech</span></div>
            </div>

            <div class="nav-section">Main</div>
            <a href="admin-dashboard.html" class="nav-item">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>
            <a href="admin-analytics.html" class="nav-item">
                <i class="fas fa-chart-line"></i> Analytics
            </a>
            <a href="admin-orders.html" class="nav-item">
                <i class="fas fa-shopping-bag"></i> Orders
            </a>
            <a href="admin-customers.html" class="nav-item">
                <i class="fas fa-users"></i> Customers
            </a>
            <a href="admin-reviews.html" class="nav-item">
                <i class="fas fa-star"></i> Reviews
            </a>

            <div class="nav-section">Products</div>
            <a href="admin-add-product.html" class="nav-item">
                <i class="fas fa-plus-circle"></i> Add Product
            </a>
            <a href="admin-products.html" class="nav-item">
                <i class="fas fa-boxes"></i> Product List
            </a>

            <div class="nav-section">Settings</div>
            <a href="admin-business-info.html" class="nav-item">
                <i class="fas fa-store"></i> Business Info
            </a>
            <a href="admin-featured.html" class="nav-item active">
                <i class="fas fa-star"></i> Featured Product
            </a>
            <a href="admin-contact.html" class="nav-item">
                <i class="fas fa-map-marker-alt"></i> Contact & Location
            </a>
                        <a href="admin-category-showcase.html" class="nav-item">
                <i class="fas fa-layer-group"></i> Category Showcase
            </a>

            <div class="logout-btn">
                <div class="nav-item" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="topbar">
                <div style="display:flex;align-items:center;gap:12px;">
                    <button class="mobile-toggle" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1>⭐ Featured Product</h1>
                </div>
                <div class="admin-info">
                    <span style="font-size:14px;color:#475569;" id="adminName">Admin</span>
                    <div class="avatar" id="adminAvatar">A</div>
                </div>
            </div>

            <!-- Form -->
            <div class="form-container">
                <form id="featuredForm">
                    <div class="form-group">
                        <label>Select Product to Feature</label>
                        <select id="productSelect" required>
                            <option value="">Select a product...</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">
                        <i class="fas fa-star"></i> Add to Featured
                    </button>
                </form>

                <!-- Featured List -->
                <div class="featured-list">
                    <h3 style="font-weight:700;font-size:16px;margin-bottom:12px;">Current Featured Products</h3>
                    <div id="featuredList">
                        <div style="text-align:center;padding:20px;color:#94A3B8;">
                            <i class="fas fa-spinner fa-spin"></i> Loading...
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        //  ADMIN FEATURED PRODUCT
        // ============================================================

        const SUPABASE_URL = 'https://bulprhgwuwatzobiojwz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1bHByaGd3dXdhdHpvYmlvand6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MDczNDksImV4cCI6MjA5MjA4MzM0OX0.2fcHrGX7iXw5G9nGRNkBy70W1Ex_om1C0v3qbryPmvw';

        let supabaseClient = null;

        function getSupabase() {
            if (supabaseClient) return supabaseClient;
            if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return supabaseClient;
            }
            return null;
        }

        function checkAuth() {
            const session = JSON.parse(localStorage.getItem('admin_session') || 'null');
            if (!session || !session.loggedIn) {
                window.location.href = 'admin-login.html';
                return false;
            }
            const name = session.user?.email?.split('@')[0] || 'Admin';
            document.getElementById('adminName').textContent = name.charAt(0).toUpperCase() + name.slice(1);
            document.getElementById('adminAvatar').textContent = name.charAt(0).toUpperCase();
            return true;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function logout() {
            localStorage.removeItem('admin_session');
            window.location.href = 'admin-login.html';
        }

        function showToast(msg, type = 'success') {
            const existing = document.querySelector('.toast-msg');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast-msg ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Load Products for Select ---
        async function loadProductSelect() {
            const client = getSupabase();
            if (!client) return;

            try {
                const { data, error } = await client
                    .from('products')
                    .select('id, name')
                    .order('name', { ascending: true });

                if (error) throw error;

                const select = document.getElementById('productSelect');
                select.innerHTML = '<option value="">Select a product...</option>';
                
                data.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p.id;
                    option.textContent = p.name;
                    select.appendChild(option);
                });

            } catch (err) {
                console.error('Error loading products:', err);
            }
        }

        // --- Load Featured Products ---
        async function loadFeatured() {
            const client = getSupabase();
            if (!client) return;

            try {
                const { data, error } = await client
                    .from('featured_products')
                    .select('product_id, products(name, image)')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const container = document.getElementById('featuredList');

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div style="text-align:center;padding:20px;color:#94A3B8;">
                            <i class="fas fa-star" style="font-size:24px;display:block;margin-bottom:8px;"></i>
                            No featured products yet
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.map(item => {
                    const product = item.products || {};
                    const image = product.image || 'https://placehold.co/40x40/6C3CE1/FFFFFF?text=Product';
                    
                    return `
                        <div class="featured-item">
                            <div class="product-info">
                                <img src="${image}" alt="${product.name}" onerror="this.src='https://placehold.co/40x40/6C3CE1/FFFFFF?text=Product'" />
                                <span style="font-weight:600;">${product.name || 'Unknown'}</span>
                            </div>
                            <button class="remove-btn" onclick="removeFeatured('${item.product_id}')">
                                <i class="fas fa-times"></i> Remove
                            </button>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('Error loading featured:', err);
            }
        }

        // --- Add Featured ---
        document.getElementById('featuredForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const productId = document.getElementById('productSelect').value;
            if (!productId) {
                showToast('Please select a product', 'error');
                return;
            }

            const client = getSupabase();
            if (!client) {
                showToast('❌ Database connection failed', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';

            try {
                // Check if already featured
                const { data: existing, error: checkError } = await client
                    .from('featured_products')
                    .select('product_id')
                    .eq('product_id', productId)
                    .maybeSingle();

                if (existing) {
                    showToast('⚠️ Product is already featured', 'warning');
                    btn.innerHTML = '<i class="fas fa-star"></i> Add to Featured';
                    btn.disabled = false;
                    return;
                }

                const { error } = await client
                    .from('featured_products')
                    .insert([{ product_id: productId }]);

                if (error) throw error;

                showToast('✅ Product added to featured!');
                document.getElementById('productSelect').value = '';
                btn.innerHTML = '<i class="fas fa-star"></i> Add to Featured';
                btn.disabled = false;
                loadFeatured();

            } catch (err) {
                console.error('Error adding featured:', err);
                showToast('❌ Failed to add: ' + err.message, 'error');
                btn.innerHTML = '<i class="fas fa-star"></i> Add to Featured';
                btn.disabled = false;
            }
        });

        // --- Remove Featured ---
        async function removeFeatured(productId) {
            if (!confirm('Remove this product from featured?')) return;

            const client = getSupabase();
            if (!client) return;

            try {
                const { error } = await client
                    .from('featured_products')
                    .delete()
                    .eq('product_id', productId);

                if (error) throw error;

                showToast('🗑️ Removed from featured');
                loadFeatured();

            } catch (err) {
                console.error('Error removing featured:', err);
                showToast('❌ Failed to remove', 'error');
            }
        }

        // --- Init ---
        document.addEventListener('DOMContentLoaded', function() {
            if (checkAuth()) {
                loadProductSelect();
                loadFeatured();
                document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const sidebar = document.getElementById('sidebar');
                if (sidebar.classList.contains('open')) toggleSidebar();
            }
        });
    </script>
</body>
</html>
