<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reviews · Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0F172A; }
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 260px; background: #0F172A; color: white;
            padding: 24px 16px; position: fixed; top: 0; left: 0; bottom: 0;
            overflow-y: auto; z-index: 100; transition: transform 0.3s ease;
        }
        .sidebar .brand {
            display: flex; align-items: center; gap: 12px;
            padding: 0 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
        }
        .sidebar .brand .logo {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #6C3CE1, #5A2FC4);
            border-radius: 10px; display: flex; align-items: center;
            justify-content: center; font-weight: 800; font-size: 18px;
        }
        .sidebar .brand .name { font-weight: 700; font-size: 16px; }
        .sidebar .brand .name span { color: #8B6BE8; }
        .sidebar .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; border-radius: 10px;
            color: rgba(255,255,255,0.6); text-decoration: none;
            transition: all 0.2s ease; font-size: 14px; font-weight: 500;
            margin-bottom: 2px; cursor: pointer;
        }
        .sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .sidebar .nav-item.active { background: rgba(108,60,225,0.2); color: #8B6BE8; }
        .sidebar .nav-item i { width: 20px; font-size: 16px; }
        .sidebar .nav-section {
            padding: 12px 14px 8px; font-size: 11px; font-weight: 700;
            color: rgba(255,255,255,0.3); text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .sidebar .logout-btn {
            margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 16px;
        }
        .sidebar .logout-btn .nav-item { color: rgba(255,255,255,0.4); }
        .sidebar .logout-btn .nav-item:hover { color: #EF4444; background: rgba(239,68,68,0.1); }

        .main-content { margin-left: 260px; padding: 24px 32px; width: 100%; }

        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding-bottom: 20px; border-bottom: 1px solid #E2E8F0;
            margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
        }
        .topbar h1 { font-size: 24px; font-weight: 800; }
        .topbar .admin-info { display: flex; align-items: center; gap: 12px; }
        .topbar .admin-info .avatar {
            width: 40px; height: 40px; border-radius: 50%; background: #6C3CE1;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 16px;
        }

        .filter-bar {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            margin-bottom: 20px; padding: 12px 16px; background: white;
            border-radius: 12px; border: 1px solid #f0f0f0;
        }
        .filter-bar input, .filter-bar select {
            padding: 8px 14px; border: 2px solid #E2E8F0; border-radius: 8px;
            font-size: 13px; font-weight: 500; outline: none;
            font-family: inherit; background: white;
        }
        .filter-bar input { flex: 1; min-width: 180px; }
        .filter-bar input:focus, .filter-bar select:focus { border-color: #6C3CE1; }
        .filter-bar button {
            padding: 8px 16px; background: #6C3CE1; color: white;
            border: none; border-radius: 8px; font-weight: 600;
            font-size: 13px; cursor: pointer; font-family: inherit;
            transition: all 0.2s ease;
        }
        .filter-bar button:hover { background: #5A2FC4; }

        .reviews-list { display: flex; flex-direction: column; gap: 12px; }
        .review-item {
            background: white; border-radius: 16px; padding: 20px 24px;
            border: 1px solid #f0f0f0; transition: all 0.2s ease;
        }
        .review-item:hover { border-color: #6C3CE1; }

        .review-body { display: flex; gap: 16px; }
        .product-thumb {
            width: 64px; height: 64px; border-radius: 10px;
            object-fit: cover; background: #F1F5F9; flex-shrink: 0;
        }
        .review-content { flex: 1; min-width: 0; }

        .review-header {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 8px; margin-bottom: 6px;
        }
        .review-header .product {
            font-size: 14px; color: #6C3CE1; font-weight: 700;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .review-header .stars { color: #F59E0B; letter-spacing: 1px; font-size: 14px; }

        .review-text {
            font-size: 14px; color: #475569; line-height: 1.6;
            word-wrap: break-word;
        }

        .review-footer {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 12px; padding-top: 12px; border-top: 1px solid #f1f5f9;
            flex-wrap: wrap; gap: 8px;
        }
        .review-footer .meta { font-size: 12px; color: #94A3B8; }
        .review-footer .badge {
            display: inline-block; margin-left: 8px; padding: 2px 8px;
            border-radius: 999px; font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.4px;
        }
        .badge.approved { background: #D1FAE5; color: #059669; }
        .badge.pending  { background: #FEF3C7; color: #B45309; }

        .review-footer .actions { display: flex; gap: 8px; }
        .review-footer .actions button {
            padding: 5px 12px; border: none; border-radius: 6px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: all 0.2s ease;
        }
        .review-footer .actions .approve { background: #D1FAE5; color: #059669; }
        .review-footer .actions .approve:hover { background: #059669; color: white; }
        .review-footer .actions .unapprove { background: #E0E7FF; color: #4338CA; }
        .review-footer .actions .unapprove:hover { background: #4338CA; color: white; }
        .review-footer .actions .delete  { background: #FEE2E2; color: #DC2626; }
        .review-footer .actions .delete:hover { background: #DC2626; color: white; }

        .pagination {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; padding: 16px; margin-top: 20px;
        }
        .pagination button {
            padding: 6px 14px; border: 2px solid #E2E8F0;
            border-radius: 8px; background: white; font-weight: 600;
            font-size: 13px; cursor: pointer; font-family: inherit;
            transition: all 0.2s ease;
        }
        .pagination button:hover { border-color: #6C3CE1; color: #6C3CE1; }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

        .mobile-toggle {
            display: none; background: none; border: none; font-size: 24px;
            color: #0F172A; cursor: pointer; padding: 8px;
        }
        .sidebar-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.4); z-index: 99;
        }

        /* Toast */
        .toast-msg {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            background: #0F172A; color: white; padding: 12px 20px;
            border-radius: 10px; font-size: 14px; font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 1000;
            animation: toastIn 0.25s ease;
        }
        .toast-msg.error { background: #DC2626; }
        .toast-msg.hide { opacity: 0; transform: translateX(-50%) translateY(10px); transition: all 0.3s ease; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.active { display: block; }
            .main-content { margin-left: 0; padding: 16px; }
            .mobile-toggle { display: block; }
            .topbar h1 { font-size: 20px; }
            .review-item { padding: 16px; }
            .filter-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="logo">ST</div>
                <div class="name">Sucess<span>Tech</span></div>
            </div>

            <div class="nav-section">Main</div>
            <a href="/admin-dashboard/" class="nav-item">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>
            <a href="/admin-analytics/" class="nav-item">
                <i class="fas fa-chart-line"></i> Analytics
            </a>
            <a href="/admin-orders/" class="nav-item">
                <i class="fas fa-shopping-bag"></i> Orders
            </a>
            <a href="/admin-customers/" class="nav-item">
                <i class="fas fa-users"></i> Customers
            </a>
            <a href="/admin-reviews/" class="nav-item active">
                <i class="fas fa-star"></i> Reviews
            </a>

            <div class="nav-section">Products</div>
            <a href="/admin-add-product/" class="nav-item">
                <i class="fas fa-plus-circle"></i> Add Product
            </a>
            <a href="/admin-products/" class="nav-item">
                <i class="fas fa-boxes"></i> Product List
            </a>

            <div class="nav-section">Settings</div>
            <a href="/admin-business-info/" class="nav-item">
                <i class="fas fa-store"></i> Business Info
            </a>
            <a href="/admin-featured/" class="nav-item">
                <i class="fas fa-star"></i> Featured Product
            </a>
            <a href="/admin-contact/" class="nav-item">
                <i class="fas fa-map-marker-alt"></i> Contact & Location
            </a>
            <a href="/admin-category-showcase/" class="nav-item">
                <i class="fas fa-layer-group"></i> Category Showcase
            </a>

            <div class="logout-btn">
                <div class="nav-item" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar">
                <div style="display:flex;align-items:center;gap:12px;">
                    <button class="mobile-toggle" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1>⭐ Reviews</h1>
                </div>
                <div class="admin-info">
                    <span style="font-size:14px;color:#475569;" id="adminName">Admin</span>
                    <div class="avatar" id="adminAvatar">A</div>
                </div>
            </div>

            <div class="filter-bar">
                <input type="text" id="searchInput"
                       placeholder="Search by customer, comment, or product..." />
                <select id="statusSelect">
                    <option value="all">All statuses</option>
                    <option value="pending">Pending</option>
                    <option value="approved">Approved</option>
                </select>
                <button onclick="loadReviews(1)"><i class="fas fa-search"></i> Search</button>
                <button onclick="resetFilters()" style="background:#E2E8F0;color:#475569;">Reset</button>
            </div>

            <div class="reviews-list" id="reviewsList">
                <div style="text-align:center;padding:40px;color:#94A3B8;">
                    <i class="fas fa-spinner fa-spin"></i> Loading reviews...
                </div>
            </div>

            <div class="pagination" id="pagination">
                <button onclick="prevPage()" id="prevBtn">←</button>
                <span id="pageInfo">Page 1</span>
                <button onclick="nextPage()" id="nextBtn">→</button>
            </div>
        </main>
    </div>

    <script>
    // ============================================================
    //  ADMIN REVIEWS — Supabase Auth + RPC
    // ============================================================
    const SUPABASE_URL = 'https://bulprhgwuwatzobiojwz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1bHByaGd3dXdhdHpvYmlvand6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MDczNDksImV4cCI6MjA5MjA4MzM0OX0.2fcHrGX7iXw5G9nGRNkBy70W1Ex_om1C0v3qbryPmvw';

    const getsb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const LOGIN_URL = '/login/';

    let currentPage = 1;
    const perPage = 10;
    let totalReviews = 0;

    // ---------- Sidebar ----------
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('active');
    }
    window.toggleSidebar = toggleSidebar;

    document.getElementById('sidebarOverlay')?.addEventListener('click', toggleSidebar);
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('open')) toggleSidebar();
        }
    });

    // ---------- Logout ----------
    async function logout() {
        try {
            await getsb.auth.signOut();
            sessionStorage.removeItem('st_admin_display');
        } catch (_) {}
        window.location.href = LOGIN_URL;
    }
    window.logout = logout;

    // ---------- Auth ----------
    async function checkAuth() {
        try {
            const { data: { session } } = await getsb.auth.getSession();
            if (!session) { window.location.href = LOGIN_URL; return null; }

            const { data: me, error } = await getsb.rpc('admin_me');
            if (error || !me || me.length === 0) {
                await getsb.auth.signOut();
                window.location.href = LOGIN_URL;
                return null;
            }
            const admin = me[0];
            const displayName = admin.full_name || admin.email || 'Admin';
            document.getElementById('adminName').textContent = displayName;
            document.getElementById('adminAvatar').textContent = displayName.charAt(0).toUpperCase();
            return admin;
        } catch (err) {
            console.error('checkAuth error:', err);
            window.location.href = LOGIN_URL;
            return null;
        }
    }

    // ---------- Helpers ----------
    function escapeHtml(s) {
        return String(s ?? '')
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
            .replace(/'/g,'&#39;');
    }
    function fmtDate(d) {
        if (!d) return '–';
        try {
            return new Date(d).toLocaleDateString('en-GB', {
                day: '2-digit', month: 'short', year: 'numeric'
            });
        } catch { return '–'; }
    }
    function showToast(msg, type = 'success') {
        const existing = document.querySelector('.toast-msg');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = `toast-msg ${type}`;
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => {
            toast.classList.add('hide');
            setTimeout(() => toast.remove(), 300);
        }, 2500);
    }

    // ---------- Load Reviews (RPC) ----------
    async function loadReviews(page = 1) {
        currentPage = page;
        const search = (document.getElementById('searchInput').value || '').trim();
        const status = document.getElementById('statusSelect').value || 'all';
        const container = document.getElementById('reviewsList');

        container.innerHTML = `<div style="text-align:center;padding:40px;color:#94A3B8;">
            <i class="fas fa-spinner fa-spin"></i> Loading reviews...
        </div>`;

        try {
            const offset = (page - 1) * perPage;

            // ✅ SECURE: single RPC — search + filter + paginate + real product join
            const { data, error } = await getsb.rpc('admin_list_reviews', {
                p_search: search,
                p_status: status,
                p_limit:  perPage,
                p_offset: offset
            });

            if (error) throw error;

            const rows = data || [];

            if (rows.length === 0) {
                totalReviews = 0;
                renderReviews([]);
                updatePagination();
                return;
            }

            totalReviews = Number(rows[0].total_count || rows.length);
            const reviews = rows.map(({ total_count, ...r }) => r);

            renderReviews(reviews);
            updatePagination();

        } catch (err) {
            console.error('Error loading reviews:', err);
            container.innerHTML = `<div style="text-align:center;padding:40px;color:#EF4444;">
                <i class="fas fa-exclamation-circle" style="font-size:24px;display:block;margin-bottom:8px;"></i>
                Failed to load reviews: ${escapeHtml(err.message)}
            </div>`;
        }
    }
    window.loadReviews = loadReviews;

    // ---------- Render ----------
    function renderReviews(reviews) {
        const container = document.getElementById('reviewsList');

        if (!reviews || reviews.length === 0) {
            container.innerHTML = `<div style="text-align:center;padding:40px;color:#94A3B8;">
                <i class="fas fa-star" style="font-size:24px;display:block;margin-bottom:8px;"></i>
                No reviews found
            </div>`;
            return;
        }

        container.innerHTML = reviews.map(r => {
            const rating = Math.max(0, Math.min(5, Number(r.rating) || 0));
            const stars  = '★'.repeat(rating) + '☆'.repeat(5 - rating);
            const approved = !!r.approved;

            const badge = approved
                ? `<span class="badge approved">Approved</span>`
                : `<span class="badge pending">Pending</span>`;

            const toggleBtn = approved
                ? `<button class="unapprove" onclick="setApproved('${escapeHtml(r.id)}', false)">
                       <i class="fas fa-undo"></i> Unapprove
                   </button>`
                : `<button class="approve" onclick="setApproved('${escapeHtml(r.id)}', true)">
                       <i class="fas fa-check"></i> Approve
                   </button>`;

            const thumb = r.product_image
                ? `<img class="product-thumb" src="${escapeHtml(r.product_image)}" alt=""
                        onerror="this.style.visibility='hidden'">`
                : `<div class="product-thumb"></div>`;

            return `
                <div class="review-item" data-id="${escapeHtml(r.id)}">
                    <div class="review-body">
                        ${thumb}
                        <div class="review-content">
                            <div class="review-header">
                                <div class="product">${escapeHtml(r.product_name || 'Unknown Product')}</div>
                                <div class="stars">${stars}</div>
                            </div>
                            <div class="review-text">${escapeHtml(r.comment || 'No comment')}</div>
                            <div class="review-footer">
                                <div class="meta">
                                    by <strong>${escapeHtml(r.user_name || 'Anonymous')}</strong>
                                    · ${escapeHtml(fmtDate(r.created_at))}
                                    ${badge}
                                </div>
                                <div class="actions">
                                    ${toggleBtn}
                                    <button class="delete" onclick="deleteReview('${escapeHtml(r.id)}')">
                                        <i class="fas fa-trash-alt"></i> Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ---------- Pagination ----------
    function updatePagination() {
        const totalPages = Math.ceil(totalReviews / perPage);
        document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages || 1}`;
        document.getElementById('prevBtn').disabled = currentPage <= 1;
        document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    function prevPage() { if (currentPage > 1) loadReviews(currentPage - 1); }
    function nextPage() {
        const totalPages = Math.ceil(totalReviews / perPage);
        if (currentPage < totalPages) loadReviews(currentPage + 1);
    }
    window.prevPage = prevPage;
    window.nextPage = nextPage;

    function resetFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('statusSelect').value = 'all';
        loadReviews(1);
    }
    window.resetFilters = resetFilters;

    // ---------- Approve / Unapprove ----------
    async function setApproved(id, approved) {
        try {
            const { error } = await getsb.rpc('admin_set_review_approved', {
                p_id: id,
                p_approved: approved
            });
            if (error) throw error;

            showToast(approved ? '✅ Review approved' : '↩️ Review unapproved');
            loadReviews(currentPage);

        } catch (err) {
            console.error('Error updating review:', err);
            showToast('❌ ' + (err.message || 'Failed to update review'), 'error');
        }
    }
    window.setApproved = setApproved;

    // ---------- Delete ----------
    async function deleteReview(id) {
        if (!confirm('Delete this review? This cannot be undone.')) return;

        try {
            const { error } = await getsb.rpc('admin_delete_review', { p_id: id });
            if (error) throw error;

            showToast('🗑️ Review deleted');
            // If we just deleted the last item on this page, step back a page
            if (document.querySelectorAll('.review-item').length === 1 && currentPage > 1) {
                loadReviews(currentPage - 1);
            } else {
                loadReviews(currentPage);
            }

        } catch (err) {
            console.error('Error deleting review:', err);
            showToast('❌ ' + (err.message || 'Failed to delete review'), 'error');
        }
    }
    window.deleteReview = deleteReview;

    // ---------- Boot ----------
    document.addEventListener('DOMContentLoaded', async function() {
        const admin = await checkAuth();
        if (!admin) return;

        loadReviews(1);

        document.getElementById('searchInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') loadReviews(1);
        });
        document.getElementById('statusSelect')?.addEventListener('change', function() {
            loadReviews(1);
        });
    });
    </script>
    <script src="/push-client.js"></script>
</body>
</html>
