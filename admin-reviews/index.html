<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reviews · Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #0F172A;
        }
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 260px;
            background: #0F172A;
            color: white;
            padding: 24px 16px;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        .sidebar .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
        }
        .sidebar .brand .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6C3CE1, #5A2FC4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
        }
        .sidebar .brand .name { font-weight: 700; font-size: 16px; }
        .sidebar .brand .name span { color: #8B6BE8; }
        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
            cursor: pointer;
        }
        .sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .sidebar .nav-item.active { background: rgba(108,60,225,0.2); color: #8B6BE8; }
        .sidebar .nav-item i { width: 20px; font-size: 16px; }
        .sidebar .nav-section {
            padding: 12px 14px 8px;
            font-size: 11px;
            font-weight: 700;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .sidebar .logout-btn {
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 16px;
        }
        .sidebar .logout-btn .nav-item { color: rgba(255,255,255,0.4); }
        .sidebar .logout-btn .nav-item:hover { color: #EF4444; background: rgba(239,68,68,0.1); }
        .main-content {
            margin-left: 260px;
            padding: 24px 32px;
            width: 100%;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid #E2E8F0;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .topbar h1 { font-size: 24px; font-weight: 800; }
        .topbar .admin-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .topbar .admin-info .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #6C3CE1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
        }
        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .review-item {
            background: white;
            border-radius: 16px;
            padding: 20px 24px;
            border: 1px solid #f0f0f0;
            transition: all 0.2s ease;
        }
        .review-item:hover { border-color: #6C3CE1; }
        .review-item .review-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        .review-item .review-header .reviewer {
            font-weight: 700;
            font-size: 15px;
        }
        .review-item .review-header .stars {
            color: #F59E0B;
            letter-spacing: 1px;
        }
        .review-item .review-header .product {
            font-size: 13px;
            color: #6C3CE1;
            font-weight: 600;
        }
        .review-item .review-text {
            font-size: 14px;
            color: #475569;
            line-height: 1.6;
        }
        .review-item .review-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f1f5f9;
            flex-wrap: wrap;
            gap: 8px;
        }
        .review-item .review-footer .date {
            font-size: 12px;
            color: #94A3B8;
        }
        .review-item .review-footer .actions {
            display: flex;
            gap: 8px;
        }
        .review-item .review-footer .actions button {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .review-item .review-footer .actions .approve {
            background: #D1FAE5;
            color: #059669;
        }
        .review-item .review-footer .actions .approve:hover { background: #059669; color: white; }
        .review-item .review-footer .actions .delete {
            background: #FEE2E2;
            color: #DC2626;
        }
        .review-item .review-footer .actions .delete:hover { background: #DC2626; color: white; }
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            margin-top: 20px;
        }
        .pagination button {
            padding: 6px 14px;
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            background: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .pagination button:hover { border-color: #6C3CE1; color: #6C3CE1; }
        .pagination button.active {
            background: #6C3CE1;
            color: white;
            border-color: #6C3CE1;
        }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            color: #0F172A;
            cursor: pointer;
            padding: 8px;
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 99;
        }
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 280px;
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.active { display: block; }
            .main-content {
                margin-left: 0;
                padding: 16px;
            }
            .mobile-toggle { display: block; }
            .topbar h1 { font-size: 20px; }
            .review-item { padding: 16px; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="logo">ST</div>
                <div class="name">Sucess<span>Tech</span></div>
            </div>

            <div class="nav-section">Main</div>
            <a href="/admin-dashboard/" class="nav-item">
                <i class="fas fa-chart-pie"></i> Dashboard
            </a>
            <a href="/admin-analytics/" class="nav-item">
                <i class="fas fa-chart-line"></i> Analytics
            </a>
            <a href="/admin-orders/" class="nav-item">
                <i class="fas fa-shopping-bag"></i> Orders
            </a>
            <a href="/admin-customers/" class="nav-item">
                <i class="fas fa-users"></i> Customers
            </a>
            <a href="admin-reviews/" class="nav-item active">
                <i class="fas fa-star"></i> Reviews
            </a>

            <div class="nav-section">Products</div>
            <a href="/admin-add-product/" class="nav-item">
                <i class="fas fa-plus-circle"></i> Add Product
            </a>
            <a href="/admin-products/" class="nav-item">
                <i class="fas fa-boxes"></i> Product List
            </a>

            <div class="nav-section">Settings</div>
            <a href="/admin-business-info/" class="nav-item">
                <i class="fas fa-store"></i> Business Info
            </a>
            <a href="/admin-featured/" class="nav-item">
                <i class="fas fa-star"></i> Featured Product
            </a>
            <a href="/admin-contact/" class="nav-item">
                <i class="fas fa-map-marker-alt"></i> Contact & Location
            </a>
                        <a href="/admin-category-showcase/" class="nav-item">
                <i class="fas fa-layer-group"></i> Category Showcase
            </a>

            <div class="logout-btn">
                <div class="nav-item" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="topbar">
                <div style="display:flex;align-items:center;gap:12px;">
                    <button class="mobile-toggle" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1>⭐ Reviews</h1>
                </div>
                <div class="admin-info">
                    <span style="font-size:14px;color:#475569;" id="adminName">Admin</span>
                    <div class="avatar" id="adminAvatar">A</div>
                </div>
            </div>

            <!-- Reviews List -->
            <div class="reviews-list" id="reviewsList">
                <div style="text-align:center;padding:40px;color:#94A3B8;">
                    <i class="fas fa-spinner fa-spin"></i> Loading reviews...
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination">
                <button onclick="prevPage()" id="prevBtn">←</button>
                <span id="pageInfo">Page 1</span>
                <button onclick="nextPage()" id="nextBtn">→</button>
            </div>
        </main>
    </div>

    <script>
        // ============================================================
        //  ADMIN REVIEWS
        // ============================================================

        const SUPABASE_URL = 'https://bulprhgwuwatzobiojwz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1bHByaGd3dXdhdHpvYmlvand6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MDczNDksImV4cCI6MjA5MjA4MzM0OX0.2fcHrGX7iXw5G9nGRNkBy70W1Ex_om1C0v3qbryPmvw';

        let supabaseClient = null;
        let currentPage = 1;
        const perPage = 10;
        let totalReviews = 0;

        function getSupabase() {
            if (supabaseClient) return supabaseClient;
            if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return supabaseClient;
            }
            return null;
        }

        function checkAuth() {
            const session = JSON.parse(localStorage.getItem('admin_session') || 'null');
            if (!session || !session.loggedIn) {
                window.location.href = 'index.html';
                return false;
            }
            const name = session.user?.email?.split('@')[0] || 'Admin';
            document.getElementById('adminName').textContent = name.charAt(0).toUpperCase() + name.slice(1);
            document.getElementById('adminAvatar').textContent = name.charAt(0).toUpperCase();
            return true;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function logout() {
            localStorage.removeItem('admin_session');
            window.location.href = 'index.html';
        }

        function showToast(msg, type = 'success') {
            const existing = document.querySelector('.toast-msg');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast-msg ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Load Reviews ---
async function loadReviews(page = 1) {
    const client = getSupabase();
    if (!client) return;

    currentPage = page;

    try {
        const start = (page - 1) * perPage;
        const end = start + perPage - 1;

        // First, get the reviews with pagination
        const { data: reviewsData, error, count } = await client
            .from('reviews')
            .select('*', { count: 'exact' })
            .order('created_at', { ascending: false })
            .range(start, end);

        if (error) throw error;

        // If there are reviews, fetch the product details for each
        if (reviewsData && reviewsData.length > 0) {
            // Get all unique product IDs from the reviews
            const productIds = [...new Set(reviewsData.map(r => r.product_id).filter(id => id))];
            
            // Fetch all products in one query
            const { data: productsData, error: productError } = await client
                .from('products')
                .select('id, name, image')
                .in('id', productIds);

            if (productError) throw productError;

            // Create a map for quick product lookup
            const productMap = {};
            if (productsData) {
                productsData.forEach(p => {
                    productMap[p.id] = p;
                });
            }

            // Merge product data into reviews
            const mergedData = reviewsData.map(review => {
                const product = productMap[review.product_id] || null;
                return {
                    ...review,
                    product_name: product ? product.name : 'Unknown Product',
                    product_image: product ? product.image : ''
                };
            });

            totalReviews = count || 0;
            renderReviews(mergedData);
            updatePagination();
        } else {
            totalReviews = count || 0;
            renderReviews([]);
            updatePagination();
        }

    } catch (err) {
        console.error('Error loading reviews:', err);
        document.getElementById('reviewsList').innerHTML = `
            <div style="text-align:center;padding:40px;color:#EF4444;">
                <i class="fas fa-exclamation-circle" style="font-size:24px;display:block;margin-bottom:8px;"></i>
                Failed to load reviews: ${err.message}
            </div>
        `;
    }
}

                // --- Render Reviews ---
function renderReviews(reviews) {
    const container = document.getElementById('reviewsList');

    if (!reviews || reviews.length === 0) {
        container.innerHTML = `
            <div style="text-align:center;padding:40px;color:#94A3B8;">
                <i class="fas fa-star" style="font-size:24px;display:block;margin-bottom:8px;"></i>
                No reviews yet
            </div>
        `;
        return;
    }

    container.innerHTML = reviews.map(r => {
        const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
        // Now these come from the merged data
        const productName = r.product_name || 'Unknown Product';
        const productImage = r.product_image || '';
        const userName = r.user_name || 'Anonymous';
        const reviewDate = r.date || new Date(r.created_at).toLocaleDateString();
        
        return `
            <div class="border rounded-xl p-4 bg-slate-50" data-review-id="${r.id}" data-product-id="${r.product_id || 'Unknown'}">
                <div class="flex gap-4">
                    <img src="${productImage}" class="w-16 h-16 object-cover rounded-lg" alt="${productName}" onerror="this.src=''">
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <div>
                                <h4 class="font-bold">${productName}</h4>
                                <p class="text-sm text-slate-600">by ${userName} on ${reviewDate}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="stars text-yellow-500">${stars}</span>
                                <span class="text-sm text-slate-400">#${r.product_id || 'Unknown'}</span>
                            </div>
                        </div>
                        <div class="mt-2 text-slate-700">${r.comment || 'No comment'}</div>
                        <div class="mt-3 flex justify-end gap-2">
                            <button class="px-3 py-1 bg-green-500 text-white rounded-lg text-sm hover:bg-green-600 transition" onclick="approveReview('${r.id}')">
                                <i class="fas fa-check"></i> Approve
                            </button>
                            <button class="px-3 py-1 bg-red-500 text-white rounded-lg text-sm hover:bg-red-600 transition" onclick="deleteReview('${r.id}')">
                                <i class="fas fa-trash-alt"></i> Delete
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}
        function updatePagination() {
            const totalPages = Math.ceil(totalReviews / perPage);
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages || 1}`;
            document.getElementById('prevBtn').disabled = currentPage <= 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        }

        function prevPage() {
            if (currentPage > 1) loadReviews(currentPage - 1);
        }

        function nextPage() {
            const totalPages = Math.ceil(totalReviews / perPage);
            if (currentPage < totalPages) loadReviews(currentPage + 1);
        }

        // --- Approve Review ---
        async function approveReview(id) {
            const client = getSupabase();
            if (!client) return;

            try {
                const { error } = await client
                    .from('reviews')
                    .update({ approved: true })
                    .eq('id', id);

                if (error) throw error;

                showToast('✅ Review approved');
                loadReviews(currentPage);

            } catch (err) {
                console.error('Error approving review:', err);
                showToast('❌ Failed to approve review', 'error');
            }
        }

        // --- Delete Review ---
        async function deleteReview(id) {
            if (!confirm('Delete this review?')) return;

            const client = getSupabase();
            if (!client) return;

            try {
                const { error } = await client
                    .from('reviews')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                showToast('🗑️ Review deleted');
                loadReviews(currentPage);

            } catch (err) {
                console.error('Error deleting review:', err);
                showToast('❌ Failed to delete review', 'error');
            }
        }

        // --- Init ---
        document.addEventListener('DOMContentLoaded', function() {
            if (checkAuth()) {
                loadReviews(1);
                document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const sidebar = document.getElementById('sidebar');
                if (sidebar.classList.contains('open')) toggleSidebar();
            }
        });
    </script><script src="push-client.js"></script>
</body>
</html>
